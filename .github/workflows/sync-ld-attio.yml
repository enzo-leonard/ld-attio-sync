name: Sync LD flags → Attio

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max emails to sync (empty = all)"
        required: false
        default: "100"
      dry_run:
        description: "Dry run (1 = no Attio writes)"
        required: false
        default: "0"
  schedule:
    # Every night 01:00 Europe/Paris (CEST = UTC+2 → 23:00 UTC)
    # In winter (CET = UTC+1) this fires at 00:00 Paris — adjust if needed.
    - cron: "0 23 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run sync
        env:
          # Prefer LAUNCHDARKLY_API_KEY; fall back to LAUCH_DARK_API (typo kept from local .env)
          LAUNCHDARKLY_API_KEY: ${{ secrets.LAUNCHDARKLY_API_KEY || secrets.LAUCH_DARK_API }}
          LAUCH_DARK_API: ${{ secrets.LAUCH_DARK_API || secrets.LAUNCHDARKLY_API_KEY }}
          ATTIO_API_TOKEN: ${{ secrets.ATTIO_API_TOKEN }}
          ATTIO_LD_FLAGS_SLUG: ld_flags
          LIMIT: ${{ github.event.inputs.limit }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          DELAY_MS: "350"
          CONCURRENCY: "1"
          # Fail a single email after 3 min so one hung HTTP call can't freeze the job
          EMAIL_TIMEOUT_MS: "180000"
          NODE_OPTIONS: "--no-warnings"
        run: node sync-ld-to-attio.mjs
