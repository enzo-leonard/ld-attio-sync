name: Sync CIO email metrics → Attio

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max emails to scan (empty = all)"
        required: false
        default: ""
  schedule:
    # Weekdays, London daytime. GitHub cron is UTC.
    # Summer (BST, UTC+1): 08:00, 10:00, 12:00, 14:00, 16:00, 18:00, 20:00 London
    # Winter (GMT): the same UTC slots run one hour earlier in London
    - cron: "0 7,9,11,13,15,17,19 * * 1-5"

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync email metrics to Attio
        env:
          CUSTOMERIO_APP_API_KEY: ${{ secrets.CUSTOMERIO_APP_API_KEY }}
          CUSTOMERIO_REGION: eu
          ATTIO_API_TOKEN: ${{ secrets.ATTIO_API_TOKEN }}
          LIMIT: ${{ github.event.inputs.limit }}
          ATTIO_WRITE_RPS: "25"
          CONCURRENCY: "10"
          NODE_OPTIONS: "--no-warnings"
        run: node sync-cio-email-metrics.mjs
