name: Sync CIO email metrics → Attio

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max emails to scan (empty = all)"
        required: false
        default: ""
  schedule:
    # Every 4 hours. UTC 00:00, 04:00, 08:00, 12:00, 16:00, 20:00
    # Europe/Paris in summer (CEST): 02:00, 06:00, 10:00, 14:00, 18:00, 22:00
    - cron: "0 */4 * * *"

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync email metrics to Attio
        env:
          CUSTOMERIO_APP_API_KEY: ${{ secrets.CUSTOMERIO_APP_API_KEY }}
          CUSTOMERIO_REGION: eu
          ATTIO_API_TOKEN: ${{ secrets.ATTIO_API_TOKEN }}
          LIMIT: ${{ github.event.inputs.limit }}
          ATTIO_WRITE_RPS: "25"
          CONCURRENCY: "10"
          NODE_OPTIONS: "--no-warnings"
        run: node sync-cio-email-metrics.mjs
